<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#f7f4ef"/><rect x="60" y="60" width="960" height="960" rx="40" fill="#ffffff"/><text x="120" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0c5c4c" text-anchor="start">MYTH CHECK</text><text x="120" y="270" font-family="Georgia, serif" font-size="78" font-weight="700" fill="#1a2332" text-anchor="start">The federal 25C</text><text x="120" y="362" font-family="Georgia, serif" font-size="78" font-weight="700" fill="#1a2332" text-anchor="start">credit is over.</text><text x="120" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#5c6b7a" text-anchor="start">It ended for heat pumps placed in</text><text x="120" y="542" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#5c6b7a" text-anchor="start">service after Dec 31, 2025. If a 2026</text><text x="120" y="589" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#5c6b7a" text-anchor="start">quote counts on it, ask why.</text><svg x="760" y="700" viewBox="0 0 100 100" width="220" height="220" role="img" aria-label="Scout the raccoon"><circle cx="24" cy="24" r="11" fill="#8d929c"/><circle cx="76" cy="24" r="11" fill="#8d929c"/><circle cx="50" cy="56" r="34" fill="#8d929c"/><path d="M26 52 Q50 40 74 52 Q66 64 50 58 Q34 64 26 52Z" fill="#3b3f47"/><circle cx="39" cy="54" r="4.2" fill="#1a2332"/><circle cx="61" cy="54" r="4.2" fill="#1a2332"/><circle cx="40.4" cy="52.6" r="1.4" fill="#fff"/><circle cx="62.4" cy="52.6" r="1.4" fill="#fff"/><ellipse cx="50" cy="64" rx="4" ry="3" fill="#1a2332" opacity=".75"/><circle cx="30" cy="66" r="5" fill="#f19aae" opacity=".55"/><circle cx="70" cy="66" r="5" fill="#f19aae" opacity=".55"/></svg><text x="120" y="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5c6b7a" text-anchor="start">Source: IRS, Energy Efficient Home Improvement Credit, checked Oct 16, 2026</text><text x="120" y="960" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1a2332" text-anchor="start">dmvheatpumps.com</text></svg>